["Según el art. 9.1 LPRL, corresponde a la Inspección de Trabajo y Seguridad Social:","Ordenar la paralización inmediata de trabajos cuando advierta un riesgo grave e inminente para la seguridad o salud de los trabajadores","Aprobar los planes de prevención de las empresas","Imponer directamente las sanciones por infracciones en prevención","Art. 9.1.f. Ante una infracción, la Inspección propone la sanción a la autoridad laboral competente (9.1.a)."],

["La participación de empresarios y trabajadores en la planificación, programación, organización y control de la gestión de la mejora de las condiciones de trabajo es, según el art. 12:","Un principio básico de la política de prevención de riesgos laborales","Una facultad potestativa de cada Administración","Un derecho exclusivo de los sindicatos","Art. 12: a través de las organizaciones más representativas."],

["Los trabajadores o sus representantes que adopten las medidas del art. 21 por riesgo grave e inminente (art. 21.4):","No podrán sufrir perjuicio alguno, salvo mala fe o negligencia grave","Podrán ser sancionados si la Inspección no ratifica la paralización","Solo están protegidos si actúan por mayoría","Art. 21.4."],

["Sobre los datos de vigilancia de la salud (art. 22.4):","El acceso a la información médica personal se limita al personal médico y autoridades sanitarias; el empresario solo conoce las conclusiones sobre aptitud y necesidad de medidas preventivas","El empresario tiene acceso íntegro a los resultados médicos","Se comunican a los representantes del personal sin consentimiento","Art. 22.4: los datos no pueden usarse con fines discriminatorios ni en perjuicio del trabajador."],

["Las empresas que contraten o subcontraten obras o servicios de su propia actividad en sus centros de trabajo (art. 24.3) deberán:","Vigilar el cumplimiento de la normativa de prevención por los contratistas y subcontratistas","Asumir toda la responsabilidad sancionadora de estos","Desentenderse de su prevención una vez contratados","Art. 24.3; el art. 24.1 obliga a cooperar a empresas que concurren en un mismo centro."],
["Respecto de los trabajadores especialmente sensibles a determinados riesgos (art. 25.1), el empresario:","Garantizará de manera específica su protección, teniéndolos en cuenta en las evaluaciones de riesgos","Los destinará siempre a puestos sin riesgo, sin evaluación previa","Solo debe protegerlos si lo solicitan los representantes","Art. 25.1: incluye a quienes tengan reconocida discapacidad física, psíquica o sensorial."],

["Antes de la incorporación al trabajo de jóvenes menores de dieciocho años, el empresario debe (art. 27.1):","Evaluar los puestos a desempeñar e informar a los jóvenes y a sus padres o tutores de los riesgos y medidas adoptadas","Solicitar autorización previa a la autoridad laboral","Concertar un seguro específico de accidentes","Art. 27.1."],
["En el trabajo a través de empresas de trabajo temporal (art. 28.5), las obligaciones de formación y vigilancia de la salud corresponden a:","La empresa de trabajo temporal","La empresa usuaria","El servicio público de empleo","Art. 28.5: la usuaria responde de las condiciones de ejecución del trabajo y de la información previa de riesgos."],

["El incumplimiento por los trabajadores de sus obligaciones de prevención (art. 29.3) tiene la consideración de:","Incumplimiento laboral (art. 58.1 ET) o falta conforme al régimen disciplinario de funcionarios o personal estatutario, en su caso","Delito contra la seguridad de los trabajadores","Infracción administrativa sancionable por la Inspección de Trabajo","Art. 29.3."],
["Para cumplir el deber de prevención (art. 30.1), el empresario:","Designará uno o varios trabajadores, constituirá un servicio de prevención o concertará dicho servicio con una entidad especializada ajena","Deberá constituir siempre un servicio de prevención propio","Solo podrá concertar la prevención con una mutua","Art. 30.1."],
["Los trabajadores designados para actividades preventivas (art. 30.4):","No pueden sufrir perjuicio por su actividad, gozan de garantías propias de los representantes y deben guardar sigilo profesional","Pueden ser despedidos libremente si no resuelven los riesgos","No tienen deber de sigilo respecto de la información de la empresa","Art. 30.4: garantías de los arts. 68.a, b y c y 56.4 del Estatuto de los Trabajadores."],
["El empresario puede asumir personalmente las funciones preventivas en empresas de hasta 10 trabajadores, y hasta (art. 30.5):","25 trabajadores si la empresa dispone de un único centro de trabajo","50 trabajadores, con dos centros","15 trabajadores en cualquier caso","Art. 30.5: exige que desarrolle habitualmente su actividad en el centro de trabajo y tenga capacidad necesaria."],
["El empresario que no haya concertado el servicio de prevención con una entidad especializada ajena (art. 30.6) deberá:","Someter su sistema de prevención al control de una auditoría o evaluación externa","Constituir un comité intercentros","Comunicarlo anualmente a la Inspección de Trabajo","Art. 30.6."],

["La presencia de recursos preventivos en el centro de trabajo (art. 32 bis) es necesaria, entre otros casos, cuando:","Lo requiera la Inspección de Trabajo y Seguridad Social por las condiciones de trabajo detectadas","La empresa tenga más de 250 trabajadores","Lo solicite cualquier trabajador por escrito","Art. 32 bis.1: también si los riesgos se agravan por concurrencia de operaciones o en actividades reglamentariamente peligrosas."]

// Para añadir un tema: B[n]={t:"título",d:[[pregunta,CORRECTA,errónea,errónea,explicación],...]}
const B={1:{t:"Ley 7/1985 y ROF: disposiciones generales y la Provincia",d:D1},2:{t:"Ley 31/1995 de Prevención de Riesgos Laborales",d:D2}};
const $=s=>document.querySelector(s),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
let Q=[],iv,left,gen=false;
const mk=k=>B[k].d.map(d=>({q:d[0],c:d[1],o:sh([d[1],d[2],d[3]]),e:d[4],k}));
function route(){clearInterval(iv);const h=location.hash.slice(1),m=/^t(\d+)$/.exec(h);
if(h==="general"){gen=true;let p=[];for(const k in B)p=p.concat(mk(k));quiz("Examen general · simulacro",sh(p).slice(0,50),true)}
else if(m&&B[+m[1]]){gen=false;quiz("Tema "+m[1]+" · "+B[+m[1]].t,mk(+m[1]),false)}else home()}
function home(){const n=Object.keys(B).length;$("#app").innerHTML='<h1>Oposición Administrativo/a AG · Diputación de Badajoz</h1><p class="mu">Promoción interna · Tests por tema (sin tiempo) y examen general. Acierto +0,2 · error −0,1 · en blanco 0 · aprobado desde 5.</p><div class="sum"><b>Examen general</b><p class="mu">50 preguntas aleatorias de los temas disponibles ('+n+' de 20 por ahora) con reloj de 60 minutos, como el examen real.</p><a class="btn" href="#general">Empezar examen general</a></div><h2>Temas</h2>'+[...Array(20)].map((_,i)=>{const k=i+1,b=B[k];return b?'<a class="tm" href="#t'+k+'"><span style="white-space:normal;color:var(--fg)"><b>Tema '+k+'</b> · '+esc(b.t)+'</span><span>'+b.d.length+' preguntas</span></a>':'<div class="tm off"><span style="white-space:normal;color:var(--fg)"><b>Tema '+k+'</b> · '+esc(T[k])+'</span><span>Próximamente</span></div>'}).join("");scrollTo(0,0)}
function quiz(title,qs,timed){Q=qs;left=3600;
$("#app").innerHTML='<p><a href="#">← Portada</a></p><h1>'+esc(title)+'</h1><div class="bar"><span id="cnt">0/'+Q.length+' respondidas</span>'+(timed?'<span id="tm">60:00</span>':'')+'</div>'+Q.map((x,i)=>'<div class="q"><p>'+(i+1)+'. '+esc(x.q)+(gen?' <span class="k">(Tema '+x.k+')</span>':'')+'</p>'+x.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'" onchange="upd()">'+esc(o)+'</label>').join("")+'</div>').join("")+'<button onclick="grade()">Corregir examen</button>';
scrollTo(0,0);if(timed)iv=setInterval(()=>{left--;$("#tm").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(left<=0)grade()},1000)}
function upd(){$("#cnt").textContent=document.querySelectorAll("input:checked").length+"/"+Q.length+" respondidas"}
function grade(){clearInterval(iv);let a=0,e=0,b=0,rv="";
Q.forEach((x,i)=>{const s=document.querySelector('input[name="q'+i+'"]:checked');if(!s){b++;rv+=card(i,x,null);return}const r=x.o[+s.value];if(r===x.c)a++;else{e++;rv+=card(i,x,r)}});
const n=Math.max(0,a*.2-e*.1),f=v=>v.toFixed(2).replace(".",",");
$("#app").innerHTML='<p><a href="#">← Portada</a></p><div class="sum"><div class="big '+(n>=5?"g":"t")+'">'+f(n)+' / 10 · '+(n>=5?"Aprobado":"Suspenso")+'</div><p>Aciertos: <b>'+a+'</b> · Errores: <b>'+e+'</b> · En blanco: <b>'+b+'</b></p><p class="mu">Nota = 0,2 × aciertos − 0,1 × errores.</p></div>'+(rv?'<h2>Preguntas falladas y en blanco ('+(e+b)+')</h2>'+rv:'<h2>¡Pleno! Sin fallos.</h2>')+'<button onclick="route()">Repetir (opciones barajadas'+(gen?', nuevas preguntas':'')+')</button>';scrollTo(0,0)}
function card(i,x,r){return '<div class="r"><p><b>'+(i+1)+'. '+esc(x.q)+'</b>'+(gen?' <span class="k">(Tema '+x.k+')</span>':'')+'</p><p class="t">'+(r===null?'En blanco':'Tu respuesta: '+esc(r))+'</p><p class="g">Correcta: '+esc(x.c)+'</p><div class="e">'+esc(x.e)+'</div></div>'}
addEventListener("hashchange",route);route();
</script></body></html>
