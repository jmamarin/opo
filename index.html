["Los trabajadores o sus representantes que adopten las medidas del art. 21 por riesgo grave e inminente (art. 21.4):","No podrán sufrir perjuicio alguno, salvo mala fe o negligencia grave","Podrán ser sancionados si la Inspección no ratifica la paralización","Solo están protegidos si actúan por mayoría","Art. 21.4."],

["Sobre los datos de vigilancia de la salud (art. 22.4):","El acceso a la información médica personal se limita al personal médico y autoridades sanitarias; el empresario solo conoce las conclusiones sobre aptitud y necesidad de medidas preventivas","El empresario tiene acceso íntegro a los resultados médicos","Se comunican a los representantes del personal sin consentimiento","Art. 22.4: los datos no pueden usarse con fines discriminatorios ni en perjuicio del trabajador."],

["Las empresas que contraten o subcontraten obras o servicios de su propia actividad en sus centros de trabajo (art. 24.3) deberán:","Vigilar el cumplimiento de la normativa de prevención por los contratistas y subcontratistas","Asumir toda la responsabilidad sancionadora de estos","Desentenderse de su prevención una vez contratados","Art. 24.3; el art. 24.1 obliga a cooperar a empresas que concurren en un mismo centro."],
["Respecto de los trabajadores especialmente sensibles a determinados riesgos (art. 25.1), el empresario:","Garantizará de manera específica su protección, teniéndolos en cuenta en las evaluaciones de riesgos","Los destinará siempre a puestos sin riesgo, sin evaluación previa","Solo debe protegerlos si lo solicitan los representantes","Art. 25.1: incluye a quienes tengan reconocida discapacidad física, psíquica o sensorial."],
["Si la evaluación revela riesgo para el embarazo o la lactancia (art. 26.1), el empresario adoptará en primer lugar:","Medidas de adaptación de las condiciones o del tiempo de trabajo, incluida, si es necesario, la no realización de trabajo nocturno o a turnos","La suspensión inmediata del contrato por riesgo durante el embarazo","El cambio definitivo a un puesto de otro grupo profesional","Art. 26: si la adaptación no es posible, cambio de puesto compatible (26.2); si tampoco, suspensión del contrato por riesgo durante el embarazo (26.3)."],

["En el trabajo a través de empresas de trabajo temporal (art. 28.5), las obligaciones de formación y vigilancia de la salud corresponden a:","La empresa de trabajo temporal","La empresa usuaria","El servicio público de empleo","Art. 28.5: la usuaria responde de las condiciones de ejecución del trabajo y de la información previa de riesgos."],
["Entre las obligaciones de los trabajadores del art. 29.2 LPRL figura:","Informar de inmediato a su superior jerárquico directo y a los trabajadores designados o al servicio de prevención de cualquier situación que entrañe un riesgo","Adquirir a su cargo los equipos de protección individual","Reparar por sí mismos los equipos de protección averiados","Art. 29.2.4.º; también usar adecuadamente máquinas y equipos, no inutilizar dispositivos de seguridad y cooperar con el empresario."],

["Los trabajadores designados para actividades preventivas (art. 30.4):","No pueden sufrir perjuicio por su actividad, gozan de garantías propias de los representantes y deben guardar sigilo profesional","Pueden ser despedidos libremente si no resuelven los riesgos","No tienen deber de sigilo respecto de la información de la empresa","Art. 30.4: garantías de los arts. 68.a, b y c y 56.4 del Estatuto de los Trabajadores."],

const D3=[
["Según el art. 1 de la Ley 8/2011, su objeto es:","Hacer efectivo el derecho de igualdad de trato y oportunidades entre mujeres y hombres en Extremadura y combatir de modo integral la violencia de género","Regular el régimen sancionador de la discriminación laboral en las empresas extremeñas","Transponer al ordenamiento extremeño la Directiva 2006/54/CE","Art. 1: «para avanzar hacia una sociedad extremeña más libre, justa, democrática y solidaria»."],
["El art. 1.c reconoce a las mujeres que sufren violencia de género y a su núcleo familiar los derechos de:","Atención, asistencia, protección y recuperación integral","Información, prevención y sanción","Pensión vitalicia y prestación económica única","Art. 1.c, además de establecer medidas integrales de sensibilización, prevención y detección."],
["El ámbito territorial de aplicación de la Ley 8/2011 es (art. 2.1):","La Comunidad Autónoma de Extremadura","Todo el territorio nacional, para entidades con sede en Extremadura","Solo los municipios de más de 20.000 habitantes","Art. 2.1; además se aplica a las personas físicas y jurídicas en los términos de la ley (2.2)."],
["Según el art. 2.3.e, la ley se aplica también a:","Las entidades privadas que suscriban contratos o convenios con las Administraciones públicas de Extremadura o sean beneficiarias de sus ayudas o subvenciones","Exclusivamente a la Administración de la Comunidad Autónoma y a las Entidades Locales","Únicamente a las entidades públicas, nunca a las privadas","Art. 2.3.e."],
["Los consorcios y fundaciones con personalidad jurídica propia en los que sea mayoritaria la representación directa de las Entidades Locales (art. 2.3.b):","Están incluidos en el ámbito de aplicación de la ley","Quedan excluidos de la ley","Solo se incluyen si participa la Junta de Extremadura","Art. 2.3.b, junto con la Administración Local y sus organismos autónomos."],
["El principio de igualdad de trato (art. 3.1) proscribe:","Cualquier discriminación, directa o indirecta, por razón de sexo, en todos los ámbitos de la vida","Solo la discriminación directa en el ámbito laboral","Las diferencias de trato por razón de maternidad, que son siempre acciones positivas","Art. 3.1, singularmente en las esferas económica, social, laboral, cultural y educativa."],
["La igualdad de oportunidades (art. 3.2) impone a los poderes públicos de Extremadura la obligación de:","Adoptar las medidas oportunas para garantizar el acceso y ejercicio efectivo de los derechos políticos, civiles, económicos, sociales, laborales y culturales y eliminar la discriminación","Abstenerse de intervenir en las relaciones entre particulares","Reservar plazas por sexo en todas las convocatorias públicas","Art. 3.2."],
["Según el art. 3.6, los poderes públicos asumen el principio de:","Reconocimiento de la maternidad como valor social, evitando efectos negativos en los derechos de las mujeres, y consideración de la paternidad en un contexto de corresponsabilidad","Protección de la maternidad como excepción temporal al principio de igualdad","Neutralidad ante los modelos de familia","Art. 3.6, de acuerdo con los nuevos modelos de familia."],
["La corresponsabilidad (art. 3.7) se entiende como:","El reparto equilibrado entre mujeres y hombres de las responsabilidades familiares, las tareas domésticas y el cuidado de personas dependientes","La obligación de las empresas de ofrecer guarderías","La delegación en las Administraciones del cuidado de personas dependientes","Art. 3.7: los poderes públicos adoptarán medidas para la compatibilidad efectiva entre responsabilidades laborales, familiares y personales."],
["Las medidas de acción positiva (art. 3.8) deberán ser:","Razonables y proporcionadas al objetivo perseguido, y aplicables mientras subsistan las situaciones de desigualdad","Permanentes e indefinidas","Aplicables solo en el ámbito laboral","Art. 3.8: medidas específicas a favor de las mujeres para corregir situaciones patentes de desigualdad de hecho."],
["La integración de la perspectiva de género (art. 3.10) supone considerar sistemáticamente las situaciones, condiciones y necesidades de mujeres y hombres en todas las fases de:","Diagnóstico, planificación, ejecución y evaluación","Diseño y aprobación únicamente","Ejecución y control","Art. 3.10: en todas las políticas y acciones, a todos los niveles."],
["La interseccionalidad (art. 3.11) comprende:","Técnicas de análisis y planificación que tienen en cuenta la interacción entre el género y otros factores de discriminación","La coordinación entre Consejerías con competencias en igualdad","El reparto de competencias entre Junta y Entidades Locales","Art. 3.11: busca atender a la diversidad de las mujeres mediante mecanismos antidiscriminación de acción integral."],
["El principio de representación equilibrada (art. 3.12) alcanza también a:","Las candidaturas a las elecciones a la Asamblea de Extremadura","Solo a los órganos directivos de la Junta","Solo a los consejos de administración de las empresas públicas","Art. 3.12, además de los órganos de representación y toma de decisiones."],
["El art. 3.13 exige especial atención y garantía de los derechos de:","Las mujeres que viven en el medio rural, para favorecer su incorporación laboral, su acceso a la formación y su participación en el desarrollo sostenible","Las mujeres que residen en municipios de más de 50.000 habitantes","Las mujeres funcionarias de la Junta de Extremadura","Art. 3.13."],
["Según el art. 3.18, en los casos de violencia de género se garantizará:","La proximidad y el equilibrio de las intervenciones en el territorio y la celeridad de la intervención, para evitar el incremento de la victimización","La concentración de los servicios en las capitales de provincia","La intervención exclusiva del Instituto de la Mujer de Extremadura","Art. 3.18."],
["Según el art. 4.1, hay discriminación directa cuando una persona, por su sexo:","Sea, haya sido o pudiera ser tratada de manera menos favorable que otra en situación homóloga","Sufra una desventaja particular por una práctica aparentemente neutra","Perciba una retribución inferior en el mismo puesto, siempre","Art. 4.1. La segunda opción describe la discriminación indirecta (4.2)."],
["La discriminación indirecta (art. 4.2) es la situación en que una disposición, criterio o práctica aparentemente neutros:","Pone a las personas de un sexo en desventaja particular, salvo justificación objetiva en una finalidad legítima con medios necesarios y adecuados","Excluye expresamente a las personas de un sexo","Sanciona a quien denuncia una situación de discriminación","Art. 4.2."],
["Cualquier trato desfavorable relacionado con el embarazo, la maternidad o la paternidad constituye (art. 4.3):","Discriminación directa por razón de sexo","Discriminación indirecta por razón de sexo","Una diferencia de trato admisible si se justifica por razones organizativas","Art. 4.3."],
["Según el art. 4.4, hay representación equilibrada cuando, en el conjunto de personas de que se trate, cada sexo:","Ni supere el 60 % ni sea menos del 40 %","No supere el 70 % ni sea menos del 30 %","Alcance exactamente el 50 %","Art. 4.4."],
["Conforme al art. 4.5 (y a la LO 1/2004), la violencia de género es la ejercida sobre las mujeres por parte de:","Quienes sean o hayan sido sus cónyuges o estén o hayan estado ligados a ellas por relaciones similares de afectividad, aún sin convivencia","Cualquier persona de su entorno familiar o laboral","Solo quienes convivan actualmente con ellas","Art. 4.5: manifestación de la discriminación, la desigualdad y las relaciones de poder de los hombres sobre las mujeres."],
["El acoso sexual (art. 4.6) es cualquier comportamiento verbal, no verbal o físico:","De índole sexual, con el propósito o el efecto de atentar contra la dignidad de una persona, en particular si se crea un entorno intimidatorio, hostil, degradante, humillante u ofensivo","Reiterado durante más de tres meses en el ámbito laboral","Que se produzca únicamente entre personas de distinto nivel jerárquico","Art. 4.6."],
["El acoso por razón de sexo (art. 4.7) se diferencia del acoso sexual en que:","Exige un comportamiento relacionado con el sexo de una persona, no necesariamente de índole sexual","Solo puede producirse en el ámbito laboral","Requiere reiteración y resultado lesivo acreditado","Art. 4.7: igualmente con el propósito o efecto de atentar contra la dignidad y crear un entorno intimidatorio, hostil, degradante, humillante u ofensivo."],
["El condicionamiento de un derecho o de una expectativa de derecho a la aceptación de una situación de acoso sexual o por razón de sexo se considera (art. 4.8):","Acto de discriminación por razón de sexo","Una infracción solo disciplinaria","Una falta de respeto sin trascendencia discriminatoria","Art. 4.8; igual consideración tiene cualquier tipo de acoso."],
["El uso no sexista del lenguaje (art. 4.9) consiste en:","Utilizar expresiones lingüísticamente correctas que sustituyan a otras que invisibilizan el femenino o lo sitúan en un plano secundario respecto al masculino","Emplear siempre desdoblamientos en cada frase","Evitar cualquier referencia al género en los documentos administrativos","Art. 4.9."],

$("#app").innerHTML='<p><a href="#">← Portada</a></p><div class="sum"><div class="big '+(n>=5?"g":"t")+'">'+f(n)+' / 10 · '+(n>=5?"Aprobado":"Suspenso")+'</div><p>Aciertos: <b>'+a+'</b> · Errores: <b>'+e+'</b> · En blanco: <b>'+b+'</b></p><p class="mu">Nota = 0,2 × aciertos − 0,1 × errores.</p></div>'+(rv?'<h2>Preguntas falladas y en blanco ('+(e+b)+')</h2>'+rv:'<h2>¡Pleno! Sin fallos.</h2>')+'<button onclick="route()">Repetir (opciones barajadas'+(gen?', nuevas preguntas':'')+')</button>';scrollTo(0,0)}
function card(i,x,r){return '<div class="r"><p><b>'+(i+1)+'. '+esc(x.q)+'</b>'+(gen?' <span class="k">(Tema '+x.k+')</span>':'')+'</p><p class="t">'+(r===null?'En blanco':'Tu respuesta: '+esc(r))+'</p><p class="g">Correcta: '+esc(x.c)+'</p><div class="e">'+esc(x.e)+'</div></div>'}
addEventListener("hashchange",route);route();
</script></body></html>
